<p><a href="/blog.html">&larr; All posts</a></p>
<h1>$title$</h1>
<dl class="post-meta">
    <dt>
        Written by:
    </dt>
    <dd>
        $author$
    </dd>
    <dt>
        Date:
    </dt>
    <dd>
        <time datetime="$date$">$date$</time>
    </dd>
$if(readingtime)$
    <dt>
        Reading time:
    </dt>
    <dd>
        About $readingtime$ min
    </dd>
$endif$
    <dt>
        Keywords:
    </dt>
    <dd>
        $for(keywords)$$keywords$$sep$, $endfor$
    </dd>
</dl>
<hr />
$if(abstract)$
<div>
    <h3>$abstract-title$</h3>
    $abstract$
</div>
$endif$
<h2>Table of Contents</h2>
<div role="navigation" aria-label="Table of Contents">
$toc$
</div>
<hr />
$body$
<hr />
<p><a href="/blog.html">&larr; All posts</a> &middot; <a href="#content">Back to top &uarr;</a></p>
