# Build the site, check it, and deploy it to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  LTEXT_VERSION: "0.2.2"
  PANDOC_VERSION: "3.6.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install ltext
        run: |
          name="ltext-${LTEXT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/ltext/ltext/releases/download/v${LTEXT_VERSION}/${name}.tar.gz" | tar xz
          sudo install -m 0755 "${name}/ltext" /usr/local/bin/ltext
          ltext --version

      - name: Install pandoc
        run: |
          curl -fsSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y ./pandoc.deb
          rm pandoc.deb
          pandoc --version | head -n1

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build
        run: ./build.sh

      - name: Install linkchecker
        run: pipx install linkchecker

      - name: Lint
        run: ./lint.sh

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
